<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器 - HtmlToExe</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 12px; padding: 40px; width: 520px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    h1 { color: #20B2AA; font-size: 22px; margin-bottom: 8px; }
    .desc { color: #999; font-size: 13px; margin-bottom: 24px; }
    label { display: block; color: #333; font-size: 14px; margin-bottom: 6px; font-weight: bold; }
    input { width: 100%; padding: 14px; border: 2px solid #20B2AA; border-radius: 8px; font-size: 16px; outline: none; margin-bottom: 16px; }
    button { width: 100%; padding: 14px; background: #20B2AA; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
    button:hover { background: #1a9a92; }
    .result { background: #f5f5f5; border-radius: 8px; padding: 16px; margin-bottom: 16px; display: none; }
    .result-label { color: #666; font-size: 13px; margin-bottom: 4px; }
    .result-value { font-family: monospace; font-size: 14px; color: #20B2AA; word-break: break-all; }
    .config-output { background: #1a1a2e; color: #0f0; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; display: none; margin-bottom: 16px; }
    .copy-btn { background: #666; font-size: 14px; padding: 10px; }
    .tip { color: #999; font-size: 12px; margin-top: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
    <h1>&#128273; 密码哈希生成器</h1>
    <p class="desc">输入新密码，生成 SHA-256 哈希，替换 auth-config.js 中的哈希值即可更新密码</p>

    <label>新密码</label>
    <input type="text" id="pwdInput" placeholder="输入新密码" onkeydown="if(event.key==='Enter')generate()">

    <button onclick="generate()">生成哈希</button>

    <div class="result" id="result">
        <div class="result-label">SHA-256 哈希值：</div>
        <div class="result-value" id="hashValue"></div>
    </div>

    <div class="config-output" id="configOutput"></div>

    <button class="copy-btn" id="copyBtn" onclick="copyConfig()" style="display:none;">复制 auth-config.js 内容</button>

    <div class="tip">
        使用方法：<br>
        1. 在上方输入新密码并生成哈希<br>
        2. 复制生成的 auth-config.js 内容<br>
        3. 替换仓库中的 auth-config.js 文件<br>
        4. 推送到 GitHub 即可生效<br>
        <br>
        注意：此工具在本地浏览器运行，密码不会发送到任何服务器
    </div>
</div>

<script>
async function generate() {
    const pwd = document.getElementById('pwdInput').value.trim();
    if (!pwd) { alert('请输入密码'); return; }

    const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd));
    const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

    document.getElementById('hashValue').textContent = hashHex;
    document.getElementById('result').style.display = 'block';

    const configContent = `// ===== HtmlToExe 密码配置 =====
// 密码: ${pwd}
// 生成时间: ${new Date().toLocaleString('zh-CN')}
const AUTH_PASSWORD_HASH = '${hashHex}';`;

    document.getElementById('configOutput').textContent = configContent;
    document.getElementById('configOutput').style.display = 'block';
    document.getElementById('copyBtn').style.display = 'block';
}

function copyConfig() {
    const text = document.getElementById('configOutput').textContent;
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '已复制！';
        setTimeout(() => { btn.textContent = '复制 auth-config.js 内容'; }, 2000);
    });
}
</script>
</body>
</html>
